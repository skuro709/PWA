name: JarWorld

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Update & Deploy"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jarworld-manual-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1

      - name: Build WebAssembly
        run: bash PWA/jarworld/scripts/build-wasm.sh

      - name: Verify required files
        run: |
          test -f PWA/jarworld/index.html
          test -f PWA/jarworld/styles.css
          test -f PWA/jarworld/manifest.webmanifest
          test -f PWA/jarworld/sw.js
          test -f PWA/jarworld/src/main.js
          test -f PWA/jarworld/src/simulation.js
          test -f PWA/jarworld/src/renderer2d.js
          test -f PWA/jarworld/src/renderer3d.js
          test -f PWA/jarworld/src/environment.js
          test -f PWA/jarworld/src/storage.js
          test -f PWA/jarworld/src/sharing.js
          test -f PWA/jarworld/src/wasm/simulation.cpp
          test -f PWA/jarworld/src/wasm/simulation.hpp
          test -f PWA/jarworld/src/wasm/loader.js
          test -f PWA/jarworld/src/wasm/dist/simulation.js
          test -f PWA/jarworld/src/wasm/dist/simulation.wasm
          test -f PWA/jarworld/assets/icons/icon.svg
          test -f PWA/jarworld/assets/icons/icon-192.png
          test -f PWA/jarworld/assets/icons/icon-512.png

      - name: Commit updated WebAssembly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PWA/jarworld/src/wasm/dist/simulation.js
          git add PWA/jarworld/src/wasm/dist/simulation.wasm

          if git diff --cached --quiet; then
            echo "No WebAssembly changes to commit."
          else
            git commit -m "Update JarWorld WebAssembly"
            git push
          fi

      - name: Prepare GitHub Pages
        if: ${{ inputs.deploy == true }}
        run: |
          rm -rf public
          mkdir -p public
          cp -R PWA/jarworld/index.html public/
          cp -R PWA/jarworld/styles.css public/
          cp -R PWA/jarworld/manifest.webmanifest public/
          cp -R PWA/jarworld/sw.js public/
          cp -R PWA/jarworld/src public/
          cp -R PWA/jarworld/assets public/

      - name: Configure GitHub Pages
        if: ${{ inputs.deploy == true }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.deploy == true }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: ${{ inputs.deploy == true }}
        id: deployment
        uses: actions/deploy-pages@v4