name: Manual Update JarWorld

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.1

      - name: Build WebAssembly
        working-directory: PWA/jarworld
        run: bash scripts/build-wasm.sh

      - name: Verify required files
        working-directory: PWA/jarworld
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f src/main.js
          test -f src/simulation.js
          test -f src/renderer2d.js
          test -f src/renderer3d.js
          test -f src/environment.js
          test -f src/storage.js
          test -f src/sharing.js
          test -f src/wasm/simulation.cpp
          test -f src/wasm/simulation.hpp
          test -f src/wasm/loader.js
          test -f src/wasm/dist/simulation.js
          test -f src/wasm/dist/simulation.wasm
          test -f assets/icons/icon.svg
          test -f assets/icons/icon-192.png
          test -f assets/icons/icon-512.png

      - name: Verify index location
        run: |
          test -f PWA/jarworld/index.html

      - name: Commit updated WebAssembly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PWA/jarworld/src/wasm/dist/simulation.js
          git add PWA/jarworld/src/wasm/dist/simulation.wasm
          if git diff --cached --quiet; then
            echo "No WebAssembly changes to commit."
          else
            git commit -m "Update JarWorld WebAssembly"
            git push
          fi