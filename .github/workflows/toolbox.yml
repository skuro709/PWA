name: toolbox

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version"
        required: true
        default: "1.0.1"
      deploy:
        description: "Update & Deploy"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate files
        run: |
          set -e

          required_files=(
            "toolbox/index.html"
            "toolbox/manifest.json"
            "toolbox/sw.js"
            "toolbox/data/tool-registry.js"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing file: $file"
              exit 1
            }
          done

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format."
            exit 1
          fi

      - name: Check tool modules
        run: |
          COUNT=$(find toolbox/tools \
            -type f -name "tool.js" | wc -l)

          echo "Tool count: $COUNT"

          if [ "$COUNT" -lt 60 ]; then
            echo "Not enough tool modules."
            exit 1
          fi

      - name: Validate manifest
        run: |
          python - <<'PY'
          import json

          with open("toolbox/manifest.json", encoding="utf-8") as f:
              data = json.load(f)

          for key in ["name", "short_name", "display",
                      "start_url", "scope", "icons"]:
              if key not in data:
                  raise SystemExit(f"Missing manifest key: {key}")

          print("Manifest validation passed.")
          PY

      - name: Update version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" > toolbox/VERSION

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("toolbox/sw.js")
          text = path.read_text(encoding="utf-8")
          version = os.environ["VERSION"]

          updated, count = re.subn(
              r"(const\s+CACHE\s*=\s*['\"]my-toolbox-v)[^'\"]+(['\"])",
              rf"\g<1>{version}\g<2>",
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "CACHE version declaration was not found."
              )

          path.write_text(updated, encoding="utf-8")
          print("Service Worker cache version updated.")
          PY

      - name: Commit update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add toolbox/VERSION toolbox/sw.js

          if ! git diff --cached --quiet; then
            git commit -m "Update version to $VERSION"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Prepare deployment files
        if: ${{ inputs.deploy }}
        run: |
          mkdir -p _site/toolbox
          cp -a toolbox/. _site/toolbox/
          touch _site/.nojekyll

      - name: Setup Pages
        if: ${{ inputs.deploy }}
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        if: ${{ inputs.deploy }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Complete
        run: |
          echo "Update completed."
          echo "Version: ${{ inputs.version }}"
          echo "Deploy: ${{ inputs.deploy }}"